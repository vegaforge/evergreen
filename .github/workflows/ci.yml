name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt, clippy, test, wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Soroban on recent Rust builds contracts for wasm32v1-none, not
      # wasm32-unknown-unknown, which soroban-sdk rejects.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32v1-none

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Build example contracts to wasm
        run: |
          cargo build -p token-with-policy --target wasm32v1-none --release
          cargo build -p rarely-written-state --target wasm32v1-none --release
          cargo build -p migration-demo --target wasm32v1-none --release
